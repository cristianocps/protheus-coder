# Custom connector definition for Microsoft Copilot Studio.
#
# Import in Power Apps -> Custom connectors -> New custom connector ->
# Import an OpenAPI file. Then set:
#   - Host: the Container App FQDN (SERVICE_PROTHEUS_CODER_ENDPOINT without
#           the scheme and /mcp path), e.g. pc-app-xxxx.azurecontainerapps.io
#   - Security: API key, header name X-API-Key (value = MCP_API_KEY).
#
# The `x-ms-agentic-protocol: mcp-streamable-1.0` property tells Copilot Studio
# to treat this POST action as an MCP Streamable HTTP endpoint.
swagger: '2.0'
info:
  title: Protheus Coder MCP
  description: >-
    Servidor MCP (FastMCP + Claude Agent SDK) para entender projetos Protheus
    (AdvPL/TLPP) e outras linguagens. Expoe ferramentas de alto nivel e somente
    leitura: list_repos, sync_repo, repo_status, search_code (indices
    plugadvpl/codegraph) e ask_codebase (perguntas em linguagem natural)
    sobre repositorios do Azure DevOps.
  version: '2.0.0'
host: REPLACE_WITH_CONTAINER_APP_FQDN
basePath: /
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
paths:
  /mcp:
    post:
      summary: Protheus Coder MCP Server
      description: Endpoint MCP Streamable HTTP do Protheus Coder.
      operationId: InvokeMCP
      x-ms-agentic-protocol: mcp-streamable-1.0
      responses:
        '200':
          description: Success
securityDefinitions:
  api_key:
    type: apiKey
    in: header
    name: X-API-Key
security:
  - api_key: []
